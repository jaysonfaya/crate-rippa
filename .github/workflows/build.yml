# CRATE RIPPA (JJ DA PLUG): builds the plugin for the MPC and publishes the finished ZIPs as a GitHub release.
# Start: tab "Actions" -> "Build Crate Rippa" -> "Run workflow". Then download from the "Releases" page (right side of the repo):
#   ...-mpc-armv7.zip for the MPC Live 1 (Gen1), ...-mpc-aarch64.zip for the MPC Live III (Gen2).
# A new run with the same VERSION replaces the files of that release.
name: Build Crate Rippa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.1
      MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          repository: open-mpc/mpc-vst-plugins
          ref: 2c2ee0f621a0ff43411b8c7d7697a06e166e6b94
          path: mpc-vst-plugins
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64
      - run: python3 -m pip install --quiet pillow fonttools
      - name: Build for MPC Live 1 (armv7)
        run: TARGET=armv7 bash src/build.sh
      - name: Build for MPC Live III (aarch64)
        run: TARGET=aarch64 bash src/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: crate-rippa-v1.0.1
          path: |
            src/dist/*.zip
            src/dist/preview/*.png
      - name: Publish release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src
          TAG="v$VERSION"
          NOTES="CRATE RIPPA $VERSION by JJ DA PLUG

          - Crate-Rippa-$VERSION-mpc-aarch64.zip: MPC Live III (Gen2, MPC OS 3.x)
          - Crate-Rippa-$VERSION-mpc-armv7.zip: MPC Live 1 (Gen1)

          Do not unzip. Copy the ZIP for your MPC into local-plugins/ on the Plugin Manager USB stick."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "Crate Rippa $VERSION" --notes "$NOTES"
          fi
